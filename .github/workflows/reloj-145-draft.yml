name: Prepare Reloj Be 1.1.45 draft
on:
  push:
    branches: [release/reloj-145-distribution]
    paths: [.github/workflows/reloj-145-draft.yml]
permissions:
  contents: write
jobs:
  draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Create draft and attach checksum only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GH_REPO" = 'zoniksr/behost-apks'
          tag='reloj-be-v1.1.45'
          apk='Reloj_Be_Trabajador_v1.1.45_COMPACTO_LOGO2_PRUEBAS.apk'
          sha='9913c86f4325d18aa81cec2bc637a2d9f914844c9185b8a4d0d6bca47f1155a1'
          cd "$RUNNER_TEMP"
          printf '%s  %s\n' "$sha" "$apk" > SHA256SUMS.txt
          cat > release-notes.md <<'EOF'
          Reloj Be 1.1.45 · Edición de pruebas independiente

          PENDIENTE: adjuntar la APK indicada y comprobar su SHA-256 antes de publicar. Este borrador y su checksum no significan que la APK esté subida.

          Archivo: Reloj_Be_Trabajador_v1.1.45_COMPACTO_LOGO2_PRUEBAS.apk
          Tamaño: 99,831,601 bytes
          SHA-256: 9913c86f4325d18aa81cec2bc637a2d9f914844c9185b8a4d0d6bca47f1155a1
          Paquete: mx.behost.relojtrabajador.lab
          versionCode: 47
          Certificado SHA-256: e65ef73b6561cd53b963774ee826ad4c5ed2fe2a56376a3105790f63f4effb04

          Interfaz compacta, logo 2 Dinámico, indicadores de espera y captura facial dentro de la app. Android 6 o posterior; ARM de 32 y 64 bits.

          Se instala separada de las aplicaciones oficial y .dev. No actualiza ni migra sus datos. Requiere nueva vinculación y autorización de RH. No desinstalar la aplicación anterior para probarla.

          Compilación y firma verificadas localmente. Cámara, reconocimiento facial, GPS y asistencia real pendientes de prueba física. No declarada lista para producción.

          Compatible con el catálogo del Implementador 1.3.162. La web verifica publicación, nombre, tamaño y SHA-256 y no ofrece otro APK como sustituto automático.

          Publicar únicamente APK y SHA256SUMS.txt. No adjuntar el ZIP privado, código fuente, claves ni archivos de firma.
          EOF
          id="$(gh api "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.tag_name=="reloj-be-v1.1.45") | .id' | head -1)"
          if [ -z "$id" ]; then
            gh release create "$tag" SHA256SUMS.txt --repo "$GH_REPO" --draft --prerelease --latest=false --target main --title 'Reloj Be v1.1.45 · Compacto · Logo 2 · Pruebas' --notes-file release-notes.md
          else
            echo 'La release ya existe; se conserva sin reemplazar archivos ni publicar.'
          fi
          gh api "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.tag_name=="reloj-be-v1.1.45") | {id,tag_name,draft,prerelease,html_url,assets:[.assets[]|{name,size,digest}]}'
