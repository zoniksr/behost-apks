name: Verify and promote Restaurante Be APK catalog
on:
  push:
    branches: [main]
    paths: ['candidates/restaurante-be/*.json']
  workflow_dispatch:
    inputs:
      candidate:
        description: 'Existing candidates/restaurante-be/SEQUENCE-HASH.json on main'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: restaurante-be-signed-catalog
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'zoniksr/behost-apks' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Read trusted verifier from default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            tools/apk_catalog.py
            tools/catalog_ci.py
            catalogs/catalog-public.pem
          sparse-checkout-cone-mode: false
      - name: Verify signed candidate and real Android binaries without write permission
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_PATH: ${{ inputs.candidate }}
          EVENT_COMMIT: ${{ github.sha }}
          BEFORE_COMMIT: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          args=(verify --commit "$EVENT_COMMIT" --sdk "$ANDROID_HOME" --java "$JAVA_HOME_17_X64" --report verification/catalog-verification.json --candidate-file verification/candidate.json)
          if [[ -n "$CANDIDATE_PATH" ]]; then args+=(--candidate "$CANDIDATE_PATH"); else args+=(--before "$BEFORE_COMMIT"); fi
          python3 tools/catalog_ci.py "${args[@]}"
      - name: Keep exact candidate and read-only verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: restaurante-be-verified-candidate
          path: verification/
          if-no-files-found: error
          retention-days: 90
  promote:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Read trusted promoter from default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            tools/apk_catalog.py
            tools/catalog_ci.py
            catalogs/catalog-public.pem
          sparse-checkout-cone-mode: false
      - name: Read artifact from this workflow run only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: restaurante-be-verified-candidate
          path: verification/
      - name: Recheck signature and monotonicity, then compare-and-swap main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/catalog_ci.py promote --candidate-file verification/candidate.json --verified-report verification/catalog-verification.json --report promotion/catalog-promotion.json
      - name: Keep promotion evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: restaurante-be-catalog-promotion
          path: promotion/catalog-promotion.json
          if-no-files-found: warn
          retention-days: 90
