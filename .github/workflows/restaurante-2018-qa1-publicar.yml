name: Restaurante Be Android - verificacion y entrega
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restaurante-2018-qa1-publicar.yml'
      - 'tools/verify_restaurante_2018.py'
permissions:
  contents: read
concurrency:
  group: restaurante-2018-qa1-publicar
  cancel-in-progress: true
jobs:
  publicar:
    if: github.repository == 'zoniksr/behost-apks'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: zoniksr/behost-apks
      TAG: restaurante-be-android-v2.0.18-qa1
      SOURCE_COMMIT: fa4e37834fd8c81bbfd1a10c01db3ea8d534b456
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verificar firma identidad version integridad y alineacion
        run: python3 -u tools/verify_restaurante_2018.py
      - name: Guardar APK y auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Restaurante-Be-Android-2018-qa1-verificacion
          path: dist/
          retention-days: 7
          if-no-files-found: error
      - name: Publicar cuatro APK de pruebas sin recompilar
        shell: bash
        run: |
          set -euo pipefail
          cat > NOTAS.md <<'EOF'
          # Restaurante Be Android 2.0.18-qa1
          Hostess, Mesero, Cocina y Valet Parking. Caja y Administracion son web.
          Binarios originales del commit fa4e37834fd8c81bbfd1a10c01db3ea8d534b456, sin recompilar ni cambiar certificados.
          Firma Android v1/v2/v3, SHA-256, identidad, version y alineacion comprobadas con Android SDK.
          Las interfaces operativas web se actualizan mediante el Implementador de Restaurante Be; esta publicacion no actualiza el hosting.
          Aplicaciones .qa instaladas por separado, no reemplazan las aplicaciones sin .qa. Backend minimo declarado 6.6.8.
          Version de pruebas. No certifica dispositivos fisicos, vinculacion QR, Cloudflare, voz, vibracion, Wi-Fi/datos ni segundo plano.
          No contiene fuentes propietarias, llaves, credenciales ni datos de clientes. No desactivar las protecciones de Android.
          EOF
          if gh api "repos/$GH_REPO/releases/tags/$TAG" > existing.json 2> existing.err; then
            python3 - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path('existing.json').read_text())
          if r['draft'] or not r['prerelease']:raise SystemExit('Publicacion previa requiere revision; no se modifica.')
          PY
            mkdir roundtrip
            gh release download "$TAG" --repo "$GH_REPO" --dir roundtrip --pattern '*.apk'
            for f in dist/*.apk; do cmp "$f" "roundtrip/$(basename "$f")"; done
          else
            grep -q 'HTTP 404' existing.err || { cat existing.err; exit 1; }
            gh release create "$TAG" dist/*.apk dist/VERIFICACION_ANDROID.json dist/SHA256SUMS.txt --repo "$GH_REPO" --target "$SOURCE_COMMIT" --draft --prerelease --latest=false --title 'Restaurante Be Android 2.0.18-qa1 | Hostess, Mesero, Cocina y Valet' --notes-file NOTAS.md
            mkdir roundtrip
            gh release download "$TAG" --repo "$GH_REPO" --dir roundtrip
            cmp dist/SHA256SUMS.txt roundtrip/SHA256SUMS.txt
            (cd roundtrip && sha256sum --check SHA256SUMS.txt)
            gh release edit "$TAG" --repo "$GH_REPO" --draft=false --prerelease --latest=false
          fi
          gh release view "$TAG" --repo "$GH_REPO" --json url,isDraft,isPrerelease,assets > RESULTADO_PUBLICACION.json
          cat RESULTADO_PUBLICACION.json
          cat RESULTADO_PUBLICACION.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Restaurante-Be-resultado-publicacion
          path: RESULTADO_PUBLICACION.json
          retention-days: 7
