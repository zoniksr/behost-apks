name: Reloj Android offline build tools
on:
  push:
    branches: [build/reloj-145-toolchain]
    paths: [.github/workflows/reloj-build-toolchain.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: reloj-android-offline-tools
          run-id: 39515170911
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/input
      - name: Verify and split existing public toolchain archive
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/input"
          expected="$(awk '{print $1}' reloj-tools-SHA256.txt)"
          echo "$expected  reloj-android-tools.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/parts"
          split -b 300M -d -a 2 reloj-android-tools.tar.gz "$RUNNER_TEMP/parts/reloj-tools.tar.gz.part-"
          cd "$RUNNER_TEMP/parts"
          sha256sum reloj-tools.tar.gz.part-* > PARTS-SHA256.txt
          printf '%s  reloj-android-tools.tar.gz\n' "$expected" > FULL-SHA256.txt
          ls -lh
      - uses: actions/upload-artifact@v4
        with:
          name: reloj-tools-part-00
          path: |
            ${{ runner.temp }}/parts/reloj-tools.tar.gz.part-00
            ${{ runner.temp }}/parts/PARTS-SHA256.txt
            ${{ runner.temp }}/parts/FULL-SHA256.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: reloj-tools-part-01
          path: ${{ runner.temp }}/parts/reloj-tools.tar.gz.part-01
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: reloj-tools-part-02
          path: ${{ runner.temp }}/parts/reloj-tools.tar.gz.part-02
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
